<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống API - nghvtuan.id.vn</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 520px; margin: 0 auto; }
        h1 { color: #007bff; font-size: 20px; text-align: center; }
        .status { font-weight: bold; padding: 10px; border-radius: 4px; background: #e8f5e9; color: #2e7d32; }
        ul { list-style-type: square; padding-left: 20px; }
        li { margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thông Tin API - Domain nghvtuan.id.vn</h1>
        <div id="content">Đang kết nối API...</div>
    </div>

    <script>
        fetch('/api/tacke')
            .then(response => response.json())
            .then(data => {
                if (data.ok === 1) {
                    let html = `<p class="status">Trạng thái: ${data.msg}</p>`;
                    html += `<h3>Danh sách sinh viên:</h3><ul>`;
                    data.dssv.forEach(sv => {
                        html += `<li>Họ tên: <b>${sv.name}</b> - Số tiền: <b>${sv.money} VNĐ</b></li>`;
                    });
                    html += `</ul>`;
                    document.getElementById('content').innerHTML = html;
                }
            })
            .catch(error => {
                console.error('Lỗi gọi API:', error);
                document.getElementById('content').innerHTML = '<p style="color: red;">Không thể kết nối tới API Node-RED!</p>';
            });
    </script>
</body>
</html>
