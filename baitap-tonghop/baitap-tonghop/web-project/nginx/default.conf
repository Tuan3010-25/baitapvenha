cat << 'EOF' > ~/baitap-tonghop/web-project/nginx/conf.d/default.conf
# Website 1: nghvtuan.id.vn - Chạy trang HTML giao diện và Reverse Proxy API
server {
    listen 80;
    server_name localhost site1.local nghvtuan.id.vn;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Định tuyến API sang Node-RED container
    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Website 2: site2.local - Giả lập website thứ hai chạy song song
server {
    listen 80;
    server_name site2.local;

    location / {
        default_type text/html;
        return 200 '<html><body><h1>Chào mừng đến với Website 2 - Domain: site2.local (nghvtuan)</h1></body></html>';
    }
}
EOF