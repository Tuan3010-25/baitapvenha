version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: web_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./html:/usr/share/nginx/html
    restart: always

  nodered:
    image: nodered/node-red:latest
    container_name: web_nodered
    ports:
      - "1880:1880"
    restart: always

  mariadb:
    image: mariadb:latest
    container_name: web_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: securepassword123
    ports:
      - "3306:3306"
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: web_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: web_cloudflared
    restart: always
    command: tunnel --url http://nginx:80
